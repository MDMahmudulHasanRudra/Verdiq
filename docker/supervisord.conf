[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:api]
command=/usr/bin/dotnet /app/api/Verdiq.API.dll
directory=/app/api
environment=ASPNETCORE_URLS="http://+:5000",ASPNETCORE_ENVIRONMENT="Production",ConnectionStrings__DefaultConnection="%(ENV_ConnectionStrings__DefaultConnection)s",DocumentStorage__Path="%(ENV_DocumentStorage__Path)s"
user=root
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=/usr/local/bin/node /app/web/server.js
directory=/app/web
environment=NODE_ENV="production",PORT="3000",HOSTNAME="0.0.0.0"
user=root
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
