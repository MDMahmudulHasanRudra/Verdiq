services:
  verdiq:
    image: verdiq:latest
    container_name: verdiq
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"   # Web (Next.js)
      - "5000:5000"   # API (ASP.NET)
    environment:
      # Override on the server (e.g. .env file): POSTGRES_PASSWORD=... JWT_KEY=...
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      Jwt__Key: ${JWT_KEY:-}
      DocumentStorage__Path: /data/uploads
    volumes:
      - pgdata:/var/lib/verdiq/pgdata
      - uploads:/data/uploads
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
